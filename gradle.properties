# =====================================================================
# Minecraft 26.x no longer ships obfuscated, so Yarn (the old community
# mapping layer) was deprecated as of 1.21.10 — Loom now uses Mojang's
# official class/method names directly, no separate mappings dependency
# needed at all. That's why yarn_mappings is gone from this file.
#
# Values below are exactly what you got from https://fabricmc.net/develop/
# for the stable Minecraft 26.3 ("Wilderness Bound") release.
# =====================================================================

minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=net.anticrash
archives_base_name=anticrash

# Fabric API
fabric_api_version=0.161.0+26.3

# IMPORTANT: Minecraft 26.1+ requires Java 25 at minimum. If you're on
# Java 21, install a JDK 25 build (Adoptium/Temurin, Azul Zulu, or
# Microsoft Build of OpenJDK all publish one) and either:
#   a) make it your default `java`/JAVA_HOME, or
#   b) point Gradle at it specifically by uncommenting and editing:
# org.gradle.java.home=/path/to/jdk-25

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
