plugins {
	id 'fabric-loom' version "${project.loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` dependency: Minecraft 26.x ships with Mojang's own
	// official (unobfuscated) names, and Loom 1.17 uses them directly.
	// Yarn was deprecated as the default mapping set as of 1.21.10.

	// Loom 1.17 dropped the old modImplementation/modCompileOnly
	// configurations — plain implementation/compileOnly work now, Loom
	// handles any remapping automatically via the minecraft{} dependency.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	// Minecraft 26.1+ requires Java 25 at minimum.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
